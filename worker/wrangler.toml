name = "pixel-pick-odds"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Origins allowed to call this proxy. Replace with your GitHub Pages origin.
# No trailing slash. Add http://localhost:8080 while developing locally.
ALLOWED_ORIGINS = "https://perpetualpicks.com,https://www.perpetualpicks.com,http://localhost:8080"

# How long the edge caches odds. Higher = fewer API credits burned, and this is
# the single biggest lever on the monthly bill: credits are spent per cache MISS,
# not per tap, so a shared app burns them on cache turnover rather than usage.
# 900s (15 min) costs roughly a third of 300s and barely moves the picks.
#
# Paired with [triggers] crons below — see that comment before changing
# either value alone.
CACHE_SECONDS = "900"

# Require a signed-in account for /odds. Leave "false" until the D1 database is
# created and migrations are applied — the frontend's CONFIG.REQUIRE_AUTH must
# be flipped to match, or the app will 401 against its own proxy.
REQUIRE_AUTH = "false"

# ODDS_API_KEY is NOT set here — it is a secret:
#   wrangler secret put ODDS_API_KEY

# OWNER_PASSPHRASE is also a secret, and gates GET/PUT /settings — the durable
# bankroll/unit-size record (see src/settings.js). Until real per-user accounts
# exist, this is the single stand-in credential proving "this is the owner":
#   wrangler secret put OWNER_PASSPHRASE
# Leaving it unset is safe and non-breaking: /settings answers 503 and the app
# falls back to the localStorage-only behavior it had before sync existed.
# It is NEVER set here as a plain var — that would publish it in the repo.

# ANTHROPIC_API_KEY is likewise a secret, and optional: without it, /analysis
# (the daily AI-written matchup breakdown — see src/analysis.js) returns null
# and the app falls back to the existing quantitative price case. Set it the
# same way once you have a key:
#   wrangler secret put ANTHROPIC_API_KEY

# D1 database binding (run: wrangler d1 create pixel-pick)
[[d1_databases]]
binding = "DB"
database_name = "pixel-pick"
database_id = "3eeab8c2-b7f0-4b12-bf0b-716549af5f45"
migrations_dir = "src/migrations"

# Email Service binding for registration verification emails
[[send_email]]
name = "EMAIL"

# NOTE: auth rate limiting is handled by the QuotaManager Durable Object
# (see quota.js's handleRateLimit), NOT the [[ratelimits]] binding — that
# binding was tried and its counters didn't accumulate across separate
# requests here (verified live), which defeats brute-force protection.

# Workers Logs — without this, a production exception leaves no trail at all
# beyond a user noticing something broke.
[observability]
enabled = true

# Durable Objects for quota enforcement
[[durable_objects.bindings]]
name = "QUOTA_MANAGER"
class_name = "QuotaManager"

# Durable Object class migration — required the first time a DO class is
# introduced, separate from the D1 SQL migrations below.
[[migrations]]
tag = "v1-do"
new_sqlite_classes = ["QuotaManager"]

# Play of the Day storage — one blob per ET calendar date, written by the cron
# handler below, read by GET /potd. KV rather than D1: this is a "one record
# per day" shape with no querying needed, and D1 isn't provisioned yet anyway
# (see the binding above — database_id is still blank).
[[kv_namespaces]]
binding = "POTD_KV"
id = "15a94259af1c4d4cb4bc19076d0be2d9"

# Runs every 15 minutes rather than at the exact target times, because Cron
# Triggers are UTC-only and the target times are ET wall-clock (2am/3am/4am/
# 7am), which shift by an hour across DST — a frequent tick lets the handler
# itself check current ET time via Intl and only do the once-daily/once-
# weekly work in the matching hour, so the schedule stays correct across DST
# without needing separate UTC crons maintained by hand twice a year.
#
# CRITICAL: the cron interval and CACHE_SECONDS below are tuned as a PAIR —
# never change one without the other. A tick interval LONGER than the odds
# cache TTL means every single tick is a guaranteed cache miss, repaying
# full upstream price each time: confirmed live once already, a 20-minute
# tick against a 900s (15-minute) cache burned ~3,000-4,000 credits/day —
# 88% of that month's budget gone in 6 days. Keeping the tick interval EQUAL
# to the cache TTL (as both are here, 15 min / 900s) means only roughly
# every other tick is a real miss — a fixed, known-safe ratio, not a
# coincidence.
#
# Bumped from */30 (with CACHE_SECONDS=1800) on 2026-08-14 after the Odds
# API plan moved to 100,000 credits/month — actual spend under the old
# 30-min/1800s pairing was ~230 credits/day (~7,000/month, 7% of the OLD
# smaller budget), so doubling the tick rate to this pairing is still
# expected to land around 15-20% of the NEW, much larger budget. Re-check
# actual usage after this has run for a few days; if it's climbing higher
# than expected, widen both back out together, never just one.
[triggers]
crons = ["*/15 * * * *"]
