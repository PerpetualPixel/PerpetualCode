name = "pixel-pick-odds"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Origins allowed to call this proxy. Replace with your GitHub Pages origin.
# No trailing slash. Add http://localhost:8080 while developing locally.
ALLOWED_ORIGINS = "https://miguelsgarcia4.github.io"

# How long the edge caches odds. Higher = fewer API credits burned, and this is
# the single biggest lever on the monthly bill: credits are spent per cache MISS,
# not per tap, so a shared app burns them on cache turnover rather than usage.
# 900s (15 min) costs roughly a third of 300s and barely moves the picks.
CACHE_SECONDS = "900"

# Require a signed-in account for /odds. Leave "false" until the D1 database is
# created and migrations are applied — the frontend's CONFIG.REQUIRE_AUTH must
# be flipped to match, or the app will 401 against its own proxy.
REQUIRE_AUTH = "false"

# ODDS_API_KEY is NOT set here — it is a secret:
#   wrangler secret put ODDS_API_KEY

# ANTHROPIC_API_KEY is likewise a secret, and optional: without it, /analysis
# (the daily AI-written matchup breakdown — see src/analysis.js) returns null
# and the app falls back to the existing quantitative price case. Set it the
# same way once you have a key:
#   wrangler secret put ANTHROPIC_API_KEY

# D1 database binding (run: wrangler d1 create pixel-pick)
[[d1_databases]]
binding = "DB"
database_name = "pixel-pick"
database_id = ""

# Durable Objects for quota enforcement
[[durable_objects.bindings]]
name = "QUOTA_MANAGER"
class_name = "QuotaManager"

# Durable Object class migration — required the first time a DO class is
# introduced, separate from the D1 SQL migrations below.
[[migrations]]
tag = "v1-do"
new_sqlite_classes = ["QuotaManager"]

# Play of the Day storage — one blob per ET calendar date, written by the cron
# handler below, read by GET /potd. KV rather than D1: this is a "one record
# per day" shape with no querying needed, and D1 isn't provisioned yet anyway
# (see the binding above — database_id is still blank).
[[kv_namespaces]]
binding = "POTD_KV"
id = "15a94259af1c4d4cb4bc19076d0be2d9"

# Runs hourly rather than at the two exact target times, because Cron Triggers
# are UTC-only and the target times are ET wall-clock (8am / 7pm), which shift
# by an hour across DST — an hourly tick lets the handler itself check current
# ET time via Intl and only do real work in the matching hour, so the schedule
# stays correct across DST without needing two separate UTC crons maintained
# by hand twice a year.
[triggers]
crons = ["0 * * * *"]
