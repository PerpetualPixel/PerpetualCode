# One-off: traffic and database activity counts from Cloudflare's own
# analytics, for a look at how the app is being used (2026-11-23). Read-only
# totals; the account tables are not read (this token may not, and should not).
# Runs when this file is pushed to the review branch; never merged to main,
# and the run's log is deleted once it has been read.
name: Usage review

on:
  push:
    branches:
      - 'claude/perpetualpicks-tracking-roi-354ces'
    paths:
      - .github/workflows/usage-review.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Traffic and database activity
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > /tmp/a.mjs <<'EOF'
          const since = new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10);
          const gql = async (query, variables) => {
            const r = await fetch('https://api.cloudflare.com/client/v4/graphql', { method: 'POST', headers: { Authorization: `Bearer ${process.env.TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variables }) });
            const j = await r.json();
            if (j.errors) throw new Error(JSON.stringify(j.errors).slice(0, 300));
            return j.data.viewer.accounts[0];
          };
          const a = process.env.ACCOUNT;
          const tryIt = async (label, fn) => { console.log(`\n## ${label}`); try { await fn(); } catch (e) { console.log('not readable:', String(e.message ?? e).slice(0, 300)); } };
          await tryIt('worker requests by hour, last 7 days: the 12 busiest hours, and the spread', async () => {
            const d = await gql('query($a:String!,$s:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:5000,filter:{datetime_geq:$s,scriptName:"pixel-pick-odds"}){sum{requests errors} dimensions{datetimeHour}}}}}', { a, s: new Date(Date.now() - 7 * 864e5).toISOString() });
            const by = {}; for (const r of d.workersInvocationsAdaptive) by[r.dimensions.datetimeHour] = (by[r.dimensions.datetimeHour] ?? 0) + r.sum.requests;
            const hours = Object.entries(by).sort((x, y) => y[1] - x[1]); const n = hours.map((h) => h[1]).sort((x, y) => x - y);
            console.log('hours seen', n.length, '| median', n[Math.floor(n.length / 2)], '| p90', n[Math.floor(n.length * 0.9)], '| max', n.at(-1));
            for (const [h, c] of hours.slice(0, 12)) console.log(h, c);
          });
          await tryIt('worker requests by outcome, last 14 days', async () => {
            const d = await gql('query($a:String!,$s:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:1000,filter:{datetime_geq:$s,scriptName:"pixel-pick-odds"}){sum{requests errors} dimensions{status}}}}}', { a, s: `${since}T00:00:00Z` });
            const by = {}; for (const r of d.workersInvocationsAdaptive) by[r.dimensions.status] = (by[r.dimensions.status] ?? 0) + r.sum.requests;
            console.log(JSON.stringify(by));
          });
          await tryIt('account database activity by day (queries and rows, no contents)', async () => {
            const d = await gql('query($a:String!,$s:Date!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:1000,filter:{date_geq:$s,databaseId:"3eeab8c2-b7f0-4b12-bf0b-716549af5f45"},orderBy:[date_ASC]){sum{readQueries writeQueries rowsRead rowsWritten} dimensions{date}}}}}', { a, s: since });
            for (const r of d.d1AnalyticsAdaptiveGroups) console.log(r.dimensions.date, JSON.stringify(r.sum));
          });
          EOF
          node /tmp/a.mjs
