# One-off: counts from the account tables, for a look at how accounts are
# being used (2026-11-23). Read-only, aggregates only: no name, email or id
# is selected, and anything with an "@" in it is refused before printing.
# Runs when this file is pushed to the review branch; never merged to main,
# and the run's log is deleted once it has been read.
name: Usage review

on:
  push:
    branches:
      - 'claude/perpetualpicks-tracking-roi-354ces'
    paths:
      - .github/workflows/usage-review.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Counts
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-save --silent wrangler@4 >/dev/null 2>&1 || npm install --no-save wrangler@4
          cat > /tmp/review.mjs <<'EOF'
          import { execFileSync } from 'node:child_process';
          const DAY = "strftime('%Y-%m-%d', created_at/1000, 'unixepoch')";
          const Q = [
            ['users', "SELECT COUNT(*) total, SUM(email_verified=1) verified, SUM(email_verified=0) unverified, SUM(CASE WHEN email_verified=0 AND created_at < (strftime('%s','now')-7*86400)*1000 THEN 1 ELSE 0 END) unverified_over_7d, SUM(username IS NULL) no_username, SUM(pending_email IS NOT NULL) pending_email_change, SUM(password_reset_token IS NOT NULL) reset_tokens_out, SUM(session_epoch>0) signed_out_everywhere, MAX(session_epoch) max_epoch FROM users"],
            ['signups by week', "SELECT strftime('%Y-%W', created_at/1000, 'unixepoch') week, COUNT(*) n, SUM(email_verified=1) verified FROM users GROUP BY week ORDER BY week DESC LIMIT 14"],
            ['busiest signup days', `SELECT ${DAY} day, COUNT(*) n, SUM(email_verified=1) verified FROM users GROUP BY day ORDER BY n DESC LIMIT 6`],
            ['busiest signup hours (3 or more)', "SELECT strftime('%Y-%m-%d %H', created_at/1000, 'unixepoch') hour, COUNT(*) n, SUM(email_verified=1) verified FROM users GROUP BY hour HAVING n >= 3 ORDER BY n DESC LIMIT 8"],
            ['email providers', "SELECT CASE WHEN d IN ('gmail.com','googlemail.com') THEN 'gmail' WHEN d IN ('outlook.com','hotmail.com','live.com','msn.com') THEN 'microsoft' WHEN d IN ('yahoo.com','ymail.com','aol.com') THEN 'yahoo-aol' WHEN d IN ('icloud.com','me.com','mac.com') THEN 'apple' WHEN d LIKE 'proton%' OR d = 'pm.me' THEN 'proton' ELSE 'other' END provider, COUNT(*) n, SUM(v) verified FROM (SELECT lower(substr(email, instr(email,'@')+1)) d, email_verified v FROM users) GROUP BY provider ORDER BY n DESC"],
            ['other domains with 3 or more accounts', "SELECT d domain, COUNT(*) n, SUM(v) verified FROM (SELECT lower(substr(email, instr(email,'@')+1)) d, email_verified v FROM users) WHERE d NOT IN ('gmail.com','googlemail.com','outlook.com','hotmail.com','live.com','msn.com','yahoo.com','ymail.com','aol.com','icloud.com','me.com','mac.com') GROUP BY d HAVING n >= 3 ORDER BY n DESC LIMIT 10"],
            ['plus-addressed emails', "SELECT SUM(email LIKE '%+%@%') plus_addressed FROM users"],
            ['same mailbox under several accounts (dots and +tags removed)', "SELECT COUNT(*) mailboxes, COALESCE(SUM(n),0) accounts, COALESCE(MAX(n),0) most_on_one FROM (SELECT COUNT(*) n FROM (SELECT replace(CASE WHEN instr(l,'+') > 0 THEN substr(l,1,instr(l,'+')-1) ELSE l END, '.', '') || '#' || d k FROM (SELECT lower(substr(email,1,instr(email,'@')-1)) l, lower(substr(email,instr(email,'@')+1)) d FROM users)) GROUP BY k HAVING n > 1)"],
            ['notifications opted into', "SELECT SUM(notify_potd_email) potd_email, SUM(notify_picks_email) picks_email, SUM(notify_tracking_report_email) weekly_email, SUM(notify_ladder_email) ladder_email, SUM(notify_potd_sms + notify_picks_sms > 0) sms, SUM(email_verified=0 AND (notify_picks_email=1 OR notify_potd_email=1 OR notify_tracking_report_email=1)) unverified_opted_in FROM users"],
            ['usage log overall', "SELECT COUNT(*) user_days, COUNT(DISTINCT user_id) users, MIN(date) first_day, MAX(date) last_day, SUM(tap_count) taps, MAX(tap_count) most_in_a_day, SUM(tap_count > 3) days_over_the_limit FROM usage_log"],
            ['usage by day', "SELECT date, COUNT(*) users, SUM(tap_count) taps, MAX(tap_count) most, SUM(tap_count >= 3) at_limit, SUM(tap_count > 3) over_limit FROM usage_log GROUP BY date ORDER BY date DESC LIMIT 21"],
            ['heaviest accounts (ranked, no ids)', "SELECT ROW_NUMBER() OVER (ORDER BY SUM(tap_count) DESC) rank, COUNT(*) days, SUM(tap_count) taps, MAX(tap_count) most_in_a_day, MIN(date) first_day, MAX(date) last_day FROM usage_log GROUP BY user_id ORDER BY taps DESC LIMIT 8"],
            ['usage rows with no account', "SELECT COUNT(*) n FROM usage_log WHERE user_id NOT IN (SELECT id FROM users)"],
            ['reports by type and status', "SELECT type, status, COUNT(*) n, ROUND(AVG(length(message))) avg_len, MAX(length(message)) max_len, SUM(message LIKE '%http%') with_links FROM bug_reports GROUP BY type, status"],
            ['reports per account (ranked, no ids)', `SELECT ROW_NUMBER() OVER (ORDER BY COUNT(*) DESC) rank, COUNT(*) n, MIN(${DAY}) first_day, MAX(${DAY}) last_day FROM bug_reports GROUP BY user_id ORDER BY n DESC LIMIT 6`],
            ['busiest report days', `SELECT ${DAY} day, COUNT(*) n, COUNT(DISTINCT user_id) accounts FROM bug_reports GROUP BY day ORDER BY n DESC LIMIT 6`],
            ['repeated report texts', "SELECT COUNT(*) texts_sent_more_than_once, COALESCE(MAX(n),0) most_repeats FROM (SELECT COUNT(*) n FROM bug_reports GROUP BY message HAVING n > 1)"],
          ];
          for (const [label, sql] of Q) {
            console.log(`\n## ${label}`);
            try {
              const out = execFileSync('npx', ['wrangler', 'd1', 'execute', 'pixel-pick', '--remote', '--json', '--command', sql], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
              const rows = JSON.parse(out.slice(out.indexOf('[')))[0]?.results ?? [];
              for (const r of rows) { const line = JSON.stringify(r); console.log(line.includes('@') ? '(a row was withheld: it held an address)' : line); }
              if (!rows.length) console.log('(no rows)');
            } catch (e) { console.log('FAILED:', String(e.stderr ?? e.message ?? e).replace(/\S+@\S+/g, '(address)').slice(0, 400)); }
          }
          EOF
          node /tmp/review.mjs
      - name: Worker requests by day (may not be readable with this token)
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          since=$(date -u -d '14 days ago' +%Y-%m-%dT00:00:00Z)
          body=$(node -e 'console.log(JSON.stringify({ query: "query($a:String!,$s:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:400,filter:{datetime_geq:$s,scriptName:\"pixel-pick-odds\"},orderBy:[date_ASC]){sum{requests errors subrequests} dimensions{date status}}}}}", variables: { a: process.env.ACCOUNT, s: process.argv[1] } }))' "$since")
          curl -sS https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$body" \
            | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(j.errors){console.log("not readable:",JSON.stringify(j.errors).slice(0,300));return;}const rows=j.data.viewer.accounts[0].workersInvocationsAdaptive;const by={};for(const r of rows){const d=(by[r.dimensions.date]??={requests:0,errors:0,subrequests:0});d.requests+=r.sum.requests;d.errors+=r.sum.errors;d.subrequests+=r.sum.subrequests;}for(const [d,v] of Object.entries(by))console.log(d,JSON.stringify(v));}catch(e){console.log("not readable:",String(e).slice(0,200));}})' || true
