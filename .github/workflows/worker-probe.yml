# Read a public worker route from a runner, for when the place you are
# working from can reach GitHub but not workers.dev (the cloud sessions
# cannot). Dispatch it with a route, or push a change to this file and it
# reads the routes in PROBES below on the branch that carries the change.
#
# Read-only: every route is a public GET the app itself calls, so it
# spends no odds credits and needs no secret. The body is printed to the
# job log, trimmed, with the game-log routes summarised to their dates
# (the player route's rows are what the Pixel's Picks grader reads).
name: Worker probe

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Route to read, e.g. /player?sport=basketball_nba&team=PHI&id=3917376&stat=points'
        required: true
        type: string
      athletes:
        description: 'For a scoreboard route: ESPN athlete ids whose box lines to print, comma separated'
        required: false
        type: string
      grep:
        description: 'For a page that is not JSON: print only the lines matching this regular expression'
        required: false
        type: string
      raw:
        description: 'For a page that is not JSON: print windows of the raw HTML around each GREP match (markup kept), for writing a parser'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - .github/workflows/worker-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the route
        env:
          WORKER: https://pixel-pick-odds.mgbouldering.workers.dev
          ROUTE: ${{ inputs.path }}
          ATHLETES: ${{ inputs.athletes }}
          # The routes a push to this file reads: the open tickets' players, by team and ESPN id.
          GREP: ${{ inputs.grep }}
          RAW: ${{ inputs.raw }}
          PROBES: |
            /live/probe
        run: |
          set -uo pipefail
          ATHLETES="${ATHLETES:-3917376,4433137,4066211,3995,4066648}"
          GREP="${GREP:-mma|martial|method|double|distance|round|victory|h2h|totals|spreads|featured|additional}"
          read_route() {
            echo "=== $1"
            case "$1" in http*) url="$1";; *) url="$WORKER$1";; esac
            body=$(curl -sS --max-time 60 -H 'Accept: application/json' "$url")
            echo "$body" | node -e '
              let raw = ""; process.stdin.on("data", (c) => { raw += c; }).on("end", () => {
                // Raw mode: the text itself (markup or JSON) around each match, for writing a parser against a page or a feed shape.
                if (process.env.RAW === "true" && process.env.GREP) { const g = new RegExp(process.env.GREP, "gi"); let m; let k = 0; while ((m = g.exec(raw)) && k++ < 40) console.log("RAW", raw.slice(Math.max(0, m.index - 300), m.index + 700).replace(/\s+/g, " ")); return; }
                let d; try { d = JSON.parse(raw); } catch {
                // Not JSON (a docs page): the lines that mention the words in GREP, or the head of it.
                  const re = process.env.GREP ? new RegExp(process.env.GREP, "i") : null;
                  const text = raw.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g, "").replace(/<[^>]+>/g, " ").replace(/&nbsp;|&#160;/g, " ").replace(/[ \t]+/g, " ");
                  const lines = text.split(/\n+/).map((l) => l.trim()).filter(Boolean);
                  // A page that collapses to one huge line prints a window around each match instead of its first 12000 characters.
                  const big = (re ? lines.filter((l) => re.test(l)) : []).find((l) => l.length > 4000);
                  if (big) { const g = new RegExp(re.source, "gi"); let m; let n = 0; while ((m = g.exec(big)) && n++ < 60) console.log("...", big.slice(Math.max(0, m.index - 80), m.index + 160), "..."); return; }
                  console.log((re ? lines.filter((l) => re.test(l)) : lines).slice(0, 120).join("\n").slice(0, 12000));
                  return;
                }
                if (d && d.current && d.current.breakdowns) d = d.current; // /ufc/picks wraps the card under current, with the history beside it
                if (d && d.byTour && d.bar && Array.isArray(d.slate)) {
                // The Tennis tab (worker/src/tennis-picks.js getTennisPicks): the record, the plays of the day, the matches read and why they passed.
                console.log("TENNIS", d.date, "| record", JSON.stringify(d.record), "| atp", JSON.stringify(d.byTour.atp), "| wta", JSON.stringify(d.byTour.wta), "| card at", d.cardAt && new Date(d.cardAt).toISOString(), "| slate", d.slate.length);
                const cur = d.current || {};
                console.log("TODAY plays", (cur.plays || []).length, "| refreshed", cur.refreshedAt && new Date(cur.refreshedAt).toISOString(), "| reads", Object.keys(cur.reads || {}).length);
                for (const p of cur.plays || []) console.log("  PLAY", p.tour, p.market, "|", p.selection, "|", p.bookId, p.american, "| prob", p.prob, "edge", p.edge, "stars", p.stars, "|", p.status, p.result || "", p.actual || "", "|", p.event, p.round);
                for (const [id, r] of Object.entries(cur.reads || {})) console.log("  READ", id, r.a, "v", r.b, "|", r.event, r.round, "| market", r.pMarket, "games", r.meanGames, "straight", r.straightSets, "dogSet", r.dogSet, "| legs", r.legs, "clear", r.clear, "|", r.passed || "PLAY");
                return;
                }
                if (d && d.breakdowns && d.engine !== undefined) {
                  // The UFC picks record (worker/src/ufc-picks.js): the engine feed it read, and per bout whether the cappers paired.
                  console.log("RECORD", d.eventName, "| generated", d.generatedAt && new Date(d.generatedAt).toISOString(), "| refreshed", d.refreshedAt && new Date(d.refreshedAt).toISOString(), "| bets", (d.bets || []).length, "| passed", (d.passed || []).length);
                  const e = d.engine || {};
                  console.log("ENGINE", e.event, "| generated", e.generatedAt, "| picks on card", (e.picks || []).length, "| totals", JSON.stringify(e.totals));
                  const bds = Object.values(d.breakdowns || {}).sort((x, y) => (x.order || 0) - (y.order || 0));
                  for (const b of bds) { const g = b.engine; console.log("  BOUT", b.order, b.a, "vs", b.b, "| lean", b.leanName, b.confidence, "| cappers", g ? `ML ${g.moneyline ? `${g.moneyline.side}=${g.moneyline.selection} ${g.moneyline.consensusPct}% ${g.moneyline.tier}` : "none"}; methods ${(g.methods || []).map((m) => `${m.side}:${m.method} ${m.consensusPct}%`).join(", ") || "none"}` : "NONE"); }
                  if (d.props) console.log("PROPS legs", (d.props.legs || []).length, "| cappers read", JSON.stringify(d.props.cappers));
                  if (d.props && d.props.board) { const b = d.props.board; const legs = d.props.legs || []; const fromBoard = legs.filter((l) => (l.quotes || []).some((q) => q.source === "bestfightodds")); console.log("BOARD", b.source, "read", b.at && new Date(b.at).toISOString(), "| events", (b.events || []).map((e) => e.title).join(" / "), "| bouts", b.bouts, "| priced", b.priced, "| legs with a board quote", fromBoard.length, "of", legs.length); for (const l of fromBoard.slice(0, 12)) console.log("  PRICED", l.prop, "|", l.selection, "|", (l.quotes || []).slice(0, 3).map((q) => `${q.bookId} ${q.american > 0 ? "+" : ""}${q.american}`).join(", ")); }
                  else if (d.props) console.log("BOARD none (no board read in the record)");
                  if (d.underdog) console.log("UNDERDOG", d.underdog.name, "vs", d.underdog.opponent, d.underdog.american, "chance", d.underdog.chance);
                  return;
                }
                if (d && d.event && Array.isArray(d.event.bouts)) {
                  // A UFC card (worker/src/ufc-events.js): one line per bout, the names as ESPN spells them, for matching against the MMA Engine feed.
                  const ev = d.event;
                  console.log("CARD", ev.id, ev.name, "|", new Date(ev.date).toISOString(), "| bouts", ev.bouts.length, "| status", ev.status);
                  for (const b of ev.bouts) console.log("  BOUT", b.order, b.segment, b.weightClass, "|", b.a && b.a.name, "(" + (b.a && b.a.id) + ")", "vs", b.b && b.b.name, "(" + (b.b && b.b.id) + ")", "|", b.status, b.result ? JSON.stringify(b.result) : "");
                  return;
                }
                if (d && d.totals && Array.isArray(d.games) && d.games.every((g) => Array.isArray(g.slips))) {
                  // The recap (worker/src/live-board.js getLiveRecap): the final score of each game, its last build, and every slip graded at one unit.
                  console.log("TOTALS", JSON.stringify(d.totals));
                  for (const g of d.games) {
                    const b = g.built;
                    console.log("RECAP", g.name, "|", g.league, g.state, JSON.stringify(g.score), "| built", b ? `${new Date(b.at).toISOString().slice(11, 16)}Z Q${b.period} ${b.clock} (${b.builds} builds, first ${b.firstAt ? new Date(b.firstAt).toISOString().slice(11, 16) : "?"}Z) at ${JSON.stringify(b.score)}` : "none");
                    for (const s of g.slips) console.log("  SLIP", s.bookId, s.american, s.result.toUpperCase(), s.units, "|", s.legs.map((l) => `${l.player} ${l.point}+ ${l.stat} ${l.price} final=${l.final} ${l.hit === true ? "HIT" : l.hit === false ? "MISS" : "?"}`).join(" ; "));
                  }
                  return;
                }
                if (d && Array.isArray(d.games) && d.games.every((g) => g.espnEventId)) {
                  // The Live board (worker/src/live-board.js): each game, its clock and score, the books posting, who to watch, and the slips with their links.
                  for (const g of d.games) {
                    const t = g.tick || {};
                    console.log("GAME", g.name, "|", t.state, t.detail, JSON.stringify(t.score), "| elapsed", g.elapsed && g.elapsed.toFixed(2), "| books posting", g.probe ? g.probe.booksPosting : "none", "| weather", g.weather ? `${g.weather.shortForecast} ${g.weather.temperatureF}F wind ${g.weather.windSpeed} rain ${g.weather.precipChance}% rough=${g.weather.rough}` : "none");
                    for (const w of g.watch || []) console.log("  WATCH", w.player, w.team, w.stat, "now", w.current, "proj", w.projected, "|", w.line ? `${w.line.bookId} ${w.line.point}+ ${w.line.price} link=${Boolean(w.line.link)}` : "no line", "|", (w.lines || []).map((l) => `${l.bookId}:${l.point}@${l.price}${l.link ? "L" : ""}`).join(" "), w.why ? `| ${w.why}` : "");
                    for (const r of g.game || []) console.log("  READ", r.selection, "|", r.label, "model", r.model, "| best", r.best && `${r.best.bookId} ${r.best.price} implied=${r.best.implied} edge=${r.best.edge} ev=${r.best.ev} link=${Boolean(r.best.link)}`, "| books", r.lines.length, "|", r.why);
                    const byBook = {}; for (const c of g.candidates || []) byBook[c.bookId] = (byBook[c.bookId] || 0) + 1;
                    console.log("  CANDIDATES (top 12 by cushion)", JSON.stringify(byBook), (g.candidates || []).slice(0, 12).map((c) => `${c.bookId} ${c.player} ${c.point}+ ${c.stat} ${c.price} cushion=${c.cushion}`).join(" ; "));
                    const s = g.slips;
                    if (!s) { console.log("  SLIPS none"); continue; }
                    console.log("  SLIPS built", new Date(s.builtAt).toISOString().slice(11, 19), "builds", s.builds, "at", `Q${s.period} ${s.clock}`, JSON.stringify(s.score), "count", s.list.length);
                    for (const sl of s.list) console.log("   ", sl.bookId, sl.american, sl.diversified ? "diversified" : "", sl.shared && sl.shared.length ? `shared=${sl.shared.join(",")}` : "", "|", sl.legs.map((l) => `${l.player} ${l.point}+ ${l.stat} ${l.price} now=${l.current} proj=${l.pace || l.projected} link=${Boolean(l.link)}${l.cleared ? " CLEARED" : ""}`).join(" ; "));
                  }
                } else if (d && d.probe !== undefined && d.watch !== undefined) {
                  // The live logs (worker/src/live-probe.js): each odds snapshot with what every book posted, then the game clock a minute at a time.
                  const pr = d.probe;
                  if (pr) {
                    console.log("PROBE", pr.home, "v", pr.away, "snapshots", pr.snapshots.length);
                    for (const s of pr.snapshots) console.log(" ", new Date(s.at).toISOString().slice(11, 19), "books", s.booksPosting, s.status || "", "|", s.books.filter((b) => b.markets.length).map((b) => `${b.key}: ${b.markets.map((m) => `${m.key.replace("player_", "").replace("_alternate", "*")}=${m.players}p/${m.outcomes}`).join(" ")}`).join(" || "));
                  } else console.log("PROBE none", d.miss ? `| MISS ${d.miss.name} on ${d.miss.sportKey} at ${new Date(d.miss.at).toISOString()}; feed listed: ${(d.miss.feed || []).join(" ; ")}` : "");
                  const w = d.watch;
                  if (w) {
                    console.log("WATCH", w.name, "ticks", w.ticks.length);
                    let last = "";
                    for (const t of w.ticks) { const line = `${t.state} P${t.period} ${t.clock} ${t.detail} ${JSON.stringify(t.score)}`; if (line !== last) console.log(" ", new Date(t.at).toISOString().slice(11, 19), line, "box", t.box.length); last = line; }
                    const fin = w.ticks[w.ticks.length - 1];
                    for (const p of (fin && fin.box) || []) console.log("   ", p.team, p.name, JSON.stringify(p.stats));
                  } else console.log("WATCH none");
                } else if (d && d.rows && d.player) {
                  console.log("player", d.player.name, d.player.team, "stat", d.stat, "rows", d.rows.length, "undated", d.rows.filter((r) => !r.date).length);
                  for (const r of d.rows.slice(0, 8)) console.log(" ", new Date(r.date || 0).toISOString(), r.atVs, r.opponent, "value", r.value, r.seasonType);
                } else if (d && Array.isArray(d.seasonTypes)) {
                  // The ESPN game log itself: each season block, its event ids against the dates in the events map.
                  const ev = d.events || {};
                console.log("names", JSON.stringify(d.names), "labels", JSON.stringify(d.labels), "displayNames", JSON.stringify(d.displayNames));
                  for (const s of d.seasonTypes) for (const c of s.categories || []) {
                    const ids = (c.events || []).map((e) => e.eventId);
                    console.log(s.displayName, "|", c.displayName, ids.length, "events:", ids.slice(0, 6).map((id) => `${id}=${ev[id] ? ev[id].gameDate : "NO META"}`).join("  "));
                  }
                  console.log("events map", Object.keys(ev).length, "latest", Object.values(ev).map((m) => m.gameDate).sort().slice(-3).join(" "));
                } else if (d && Array.isArray(d.events) && d.leagues) {
                  // A scoreboard: each game, its state, and the box lines of the athletes named in ATHLETES.
                  const want = new Set(String(process.env.ATHLETES || "").split(",").filter(Boolean));
                  (async () => {
                    for (const e of d.events) {
                      const comp = e.competitions && e.competitions[0];
                      console.log(e.id, e.name, "|", e.date, "|", e.status && e.status.type && e.status.type.description);
                      if (!want.size || !comp) continue;
                      const slug = (d.leagues && d.leagues[0] && d.leagues[0].slug) || "nba";
            const sportPath = { nba: "basketball/nba", nfl: "football/nfl", nhl: "hockey/nhl" }[slug] || (slug.includes(".") ? `soccer/${slug}` : "basketball/nba");
            const sum = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${sportPath}/summary?event=${e.id}`).then((r) => r.json()).catch(() => null);
            // ATHLETES=keys: the box score blocks and their column keys, with one sample row each, for a new league stat map.
            if (want.has("keys")) { for (const team of (sum && sum.boxscore && sum.boxscore.players) || []) for (const st of team.statistics || []) { const a = (st.athletes || [])[0]; console.log("   BLOCK", team.team && team.team.abbreviation, team.team && team.team.id, st.name, "keys", JSON.stringify(st.keys || st.names), "labels", JSON.stringify(st.labels), "sample", a ? `${a.athlete && a.athlete.id} ${a.athlete && a.athlete.displayName} dnp=${a.didNotPlay} ${JSON.stringify(a.stats)}` : "none"); } return; }
                      for (const team of (sum && sum.boxscore && sum.boxscore.players) || []) for (const st of team.statistics || []) for (const a of st.athletes || []) {
                        if (!want.has(String(a.athlete && a.athlete.id))) continue;
                        const line = (st.keys || st.names || []).map((k, i) => `${k}=${(a.stats || [])[i]}`).join(" ");
                        console.log("   ", team.team && team.team.abbreviation, a.athlete.displayName, "dnp", a.didNotPlay, a.reason || "", "|", line);
                      }
                    }
                  })();
                          } else if (d && Array.isArray(d.rosters) && d.header) {
                  // A soccer summary: each side with a couple of players and the stat names on them, plus the top-level keys.
                  console.log("KEYS", Object.keys(d).join(","), "| boxscore keys", d.boxscore ? Object.keys(d.boxscore).join(",") : "none", "| status", JSON.stringify(d.header && d.header.competitions && d.header.competitions[0] && d.header.competitions[0].status));
                  for (const r of d.rosters) { const players = r.roster || []; console.log("SIDE", r.team && r.team.abbreviation, r.team && r.team.id, r.homeAway, "players", players.length); for (const p of players.slice(0, 2)) console.log("   ", p.athlete && p.athlete.id, p.athlete && p.athlete.displayName, "starter", p.starter, "pos", p.position && p.position.abbreviation, "subbedIn", p.subbedIn, "stats", JSON.stringify((p.stats || []).map((x) => `${x.name}=${x.value}`))); }
                } else if (d && Array.isArray(d.athletes) && d.athletes[0] && d.athletes[0].id) {
                  // A flat roster (soccer): the first players with ids and positions.
                  console.log("ROSTER", d.athletes.length, d.athletes.slice(0, 8).map((a) => `${a.id}=${a.displayName} ${a.position && a.position.abbreviation}`).join("  "));
                } else if (d && Array.isArray(d.sports) && d.sports[0] && d.sports[0].leagues) {
                  // A teams list: each team with its id, abbreviation and name.
                  for (const lg of d.sports[0].leagues) for (const t of lg.teams || []) console.log("TEAM", t.team && t.team.id, t.team && t.team.abbreviation, t.team && t.team.displayName);
                } else if (d && Array.isArray(d.athletes) && d.team) {
                  // A roster: each position group with a few names and ids.
                  for (const g of d.athletes) { const items = Array.isArray(g.items) ? g.items : []; console.log("GROUP", g.position || g.displayName || "?", items.length, items.slice(0, 4).map((a) => `${a.id}=${a.displayName}`).join("  ")); }
                } else console.log(JSON.stringify(d).slice(0, 4000));
              });
            '
          }
          if [ -n "${ROUTE:-}" ]; then read_route "$ROUTE"; else
            while IFS= read -r line; do [ -n "$line" ] && read_route "$line"; done <<< "$PROBES" || true
          fi
