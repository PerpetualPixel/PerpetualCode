# The Live tab, unattended: every half hour, for each league, the runner
# looks at today's scoreboard and watches every game in play or starting
# inside 45 minutes (scripts/live-watch.mjs --all), logging the clock, the
# score and the box lines a minute at a time into the worker's KV until
# the last of them is final. A run that finds nothing exits at once. One
# watcher per league at a time: a run that fires while one is still going
# waits for it, then picks up whatever is left of the night. ESPN only,
# so no odds credits; the worker's own probe reads the lines for the
# games it finds in the watch index.
name: Live auto

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      leagues:
        description: 'Leagues to scan, comma separated (default: all)'
        required: false
        type: string
        default: 'nba,nhl,nfl,ucl,epl,laliga,seriea,bundesliga,ligue1'

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        league: [nba, nhl, nfl, ucl, epl, laliga, seriea, bundesliga, ligue1]
    concurrency:
      group: live-${{ matrix.league }}
      cancel-in-progress: false
    steps:
      - name: Skip a league left out of a manual run
        id: gate
        run: |
          wanted="${{ inputs.leagues || 'nba,nhl,nfl,ucl,epl,laliga,seriea,bundesliga,ligue1' }}"
          case ",$wanted," in *",${{ matrix.league }},"*) echo "run=yes" >> "$GITHUB_OUTPUT";; *) echo "run=no" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: '22'
      - name: Watch the slate
        if: steps.gate.outputs.run == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/live-watch.mjs --league "${{ matrix.league }}" --all --lead 45 --hours 5.5 --every 60
