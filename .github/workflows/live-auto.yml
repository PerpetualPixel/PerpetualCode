# The Live tab, unattended: NBA and NFL (2026-11-06: "NFL and NBA live
# only rn"). For each league the runner lists today's games (Eastern) and
# watches every one in play or starting inside 45 minutes (scripts/
# live-watch.mjs --all), logging the clock, the score and the box lines a
# minute at a time into the worker's KV. With nothing inside the lead yet
# it waits, a scoreboard read every five minutes, as long as the day has
# games: GitHub delivered three of this file's forty-eight cron firings
# on 2026-11-05, so a run cannot count on the next one. At its hours
# limit with games still to come it starts the next run itself
# (workflow_dispatch with the default token does start a run), so a day
# is covered from the first firing to the last final. One watcher per
# league at a time. ESPN only, so no odds credits; the worker's own probe
# reads the lines for the games it finds in the watch index.
name: Live auto

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      leagues:
        description: 'Leagues to scan, comma separated (default: all)'
        required: false
        type: string
        default: 'nba,nfl'

permissions:
  contents: read
  actions: write # the run at its hours limit starts the next one

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        league: [nba, nfl]
    concurrency:
      group: live-${{ matrix.league }}
      cancel-in-progress: false
    steps:
      - name: Skip a league left out of a manual run
        id: gate
        run: |
          wanted="${{ inputs.leagues || 'nba,nfl' }}"
          case ",$wanted," in *",${{ matrix.league }},"*) echo "run=yes" >> "$GITHUB_OUTPUT";; *) echo "run=no" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: '22'
      - name: Watch the slate
        id: watch
        if: steps.gate.outputs.run == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/live-watch.mjs --league "${{ matrix.league }}" --all --lead 45 --hours 5.5 --every 60
      - name: Start the next run for the rest of the day
        if: steps.gate.outputs.run == 'yes' && steps.watch.outputs.more == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run live-auto.yml --ref main -f leagues="${{ matrix.league }}"
