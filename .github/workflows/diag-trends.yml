# Run scripts/diag-trends.mjs from a runner that can reach ESPN, and print
# what it sees — the Trends build's ESPN half, checked from outside the
# worker. On demand, and once on any branch that changes the script.
name: Diagnose Trends (ESPN)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/diag-trends.mjs
      - .github/workflows/diag-trends.yml

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diag-trends.mjs
