<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PerpetualPicks - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #05050A 0%, #0a0515 50%, #05050A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0ff;
      overflow: hidden;
    }

    /* Animated background elements */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(0deg, rgba(157, 78, 221, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(157, 78, 221, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 1;
      pointer-events: none;
    }

    .glow-orbs {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
    }

    .orb-1 {
      width: 300px;
      height: 300px;
      background: #d946ef;
      top: -100px;
      left: -100px;
      animation: float 20s infinite ease-in-out;
    }

    .orb-2 {
      width: 250px;
      height: 250px;
      background: #00d9ff;
      bottom: -50px;
      right: -50px;
      animation: float 15s infinite ease-in-out 2s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -30px); }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .auth-box {
      backdrop-filter: blur(20px);
      background: rgba(10, 5, 21, 0.7);
      border: 1px solid rgba(217, 70, 239, 0.2);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #d946ef 0%, #00d9ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }

    .logo-mark {
      display: block;
      margin: 0 auto 8px;
      height: auto;
    }

    .logo-icon-mark {
      display: block;
      margin: 0 auto 10px;
      height: auto;
    }

    .logo-sub {
      font-size: 12px;
      color: #7070aa;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #a0a0cc;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(217, 70, 239, 0.2);
      border-radius: 8px;
      color: #e0e0ff;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="text"]:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(217, 70, 239, 0.5);
      box-shadow: 0 0 20px rgba(217, 70, 239, 0.2);
    }

    input::placeholder {
      color: #5050aa;
    }

    .button {
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #d946ef 0%, #9d4edd 100%);
      border: none;
      border-radius: 8px;
      color: #05050A;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(217, 70, 239, 0.4);
    }

    .button:active {
      transform: translateY(0);
    }

    .button.secondary {
      background: transparent;
      color: #d946ef;
      border: 1px solid #d946ef;
      box-shadow: none;
    }

    .button.secondary:hover {
      background: rgba(217, 70, 239, 0.1);
      box-shadow: 0 0 20px rgba(217, 70, 239, 0.2);
    }

    .toggle-auth {
      text-align: center;
      margin-top: 20px;
      color: #7070aa;
      font-size: 13px;
    }

    .toggle-auth a {
      color: #d946ef;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .toggle-auth a:hover {
      color: #00d9ff;
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ff6b6b;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      animation: slideDown 0.3s ease;
    }

    .success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .checkbox-group input[type="checkbox"] {
      margin-top: 2px;
      width: 16px;
      height: 16px;
      flex: none;
      accent-color: #d946ef;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"]:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .checkbox-group label {
      margin-bottom: 0;
      text-transform: none;
      letter-spacing: normal;
      font-weight: 400;
      font-size: 13px;
      color: #c0c0e0;
      cursor: pointer;
    }

    .checkbox-group.is-disabled label {
      color: #606090;
      cursor: not-allowed;
    }

    .coming-soon-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(112, 112, 170, 0.15);
      color: #7070aa;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(217, 70, 239, 0.3);
      border-top-color: #d946ef;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="container">
    <div class="auth-box">
      <!-- Login Form -->
      <div id="login-form" class="auth-section">
        <div class="logo">
          <img class="logo-mark" src="/assets/logo-full.png" alt="Perpetual Picks" width="220">
          <div class="logo-sub">Sports Betting Engine</div>
        </div>

        <div id="login-message"></div>

        <form id="login-input" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
          </div>

          <button type="submit" class="button">Sign In</button>
        </form>

        <div class="toggle-auth">
          Don't have an account? <a onclick="toggleForms()">Create one</a>
        </div>
      </div>

      <!-- Register Form (Hidden by default) -->
      <div id="register-form" class="auth-section hidden">
        <div class="logo">
          <img class="logo-icon-mark" src="/assets/logo-icon-64.png" alt="" width="40">
          <div class="logo-text">JOIN NOW</div>
          <div class="logo-sub">Start Tracking Picks</div>
        </div>

        <div id="register-message"></div>

        <form id="register-input" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="register-username">Username</label>
            <input type="text" id="register-username" placeholder="your_username" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]{3,20}" required>
            <small style="color: #5050aa; font-size: 11px; margin-top: 4px; display: block;">
              3-20 characters: letters, numbers, underscores only
            </small>
          </div>

          <div class="form-group">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" placeholder="••••••••" minlength="8" required>
            <small style="color: #5050aa; font-size: 11px; margin-top: 4px; display: block;">
              Minimum 8 characters
            </small>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="register-notify-email">
            <label for="register-notify-email">Email me when Play of the Day and Pixel's Picks are ready</label>
          </div>

          <div class="checkbox-group is-disabled">
            <input type="checkbox" id="register-notify-sms" disabled>
            <label for="register-notify-sms">Text me when Play of the Day and Pixel's Picks are ready<span class="coming-soon-tag">Coming soon</span></label>
          </div>

          <button type="submit" class="button">Create Account</button>
        </form>

        <div class="toggle-auth">
          Already have an account? <a onclick="toggleForms()">Sign in</a>
        </div>
      </div>

      <!-- Email Verification Form (Hidden by default) -->
      <div id="verify-form" class="auth-section hidden">
        <div class="logo">
          <img class="logo-icon-mark" src="/assets/logo-icon-64.png" alt="" width="40">
          <div class="logo-text">VERIFY EMAIL</div>
          <div class="logo-sub">Confirm Your Address</div>
        </div>

        <div id="verify-message"></div>

        <form id="verify-input" onsubmit="handleVerify(event)">
          <div class="form-group">
            <label for="verify-token">Verification Code</label>
            <input type="text" id="verify-token" placeholder="paste the code from your email" required>
          </div>

          <button type="submit" class="button">Verify Email</button>
        </form>

        <div class="toggle-auth">
          Back to <a onclick="toggleForms('login')">login</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Global constants
    window.API_BASE = 'https://pixel-pick-odds.mgbouldering.workers.dev';
    window.AUTH_TOKEN_KEY = 'pp_auth_token';
    window.AUTH_USER_KEY = 'pp_auth_user';

    const API_BASE = window.API_BASE;
    const AUTH_TOKEN_KEY = window.AUTH_TOKEN_KEY;
    const AUTH_USER_KEY = window.AUTH_USER_KEY;

    function showMessage(elementId, message, isError = false) {
      const el = document.getElementById(elementId);
      el.innerHTML = message ? `<div class="${isError ? 'error' : 'success'}">${message}</div>` : '';
    }

    function toggleForms(target = null) {
      document.getElementById('login-form').classList.toggle('hidden');
      document.getElementById('register-form').classList.toggle('hidden');

      if (target === 'login') {
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('login-form').classList.remove('hidden');
      } else if (target === 'register') {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.remove('hidden');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('register-username').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const notifyEmail = document.getElementById('register-notify-email').checked;
      const btn = e.target.querySelector('button');
      const originalText = btn.textContent;

      try {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Creating...';

        const res = await fetch(`${window.API_BASE}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password, notifyEmail }),
        });

        const data = await res.json();

        if (!res.ok) {
          showMessage('register-message', data.error, true);
          return;
        }

        showMessage('register-message', 'Account created! Check your email to verify.', false);
        document.getElementById('register-input').reset();

        // Redirect to login after 2 seconds
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 2000);
      } catch (err) {
        showMessage('register-message', 'Connection failed: ' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = e.target.querySelector('button');
      const originalText = btn.textContent;

      try {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Signing in...';

        const res = await fetch(`${window.API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          if (res.status === 403 && data.needsVerification) {
            showMessage('login-message', 'Please verify your email first', true);
          } else {
            showMessage('login-message', data.error, true);
          }
          return;
        }

        // Store token and redirect
        localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        localStorage.setItem(AUTH_USER_KEY, JSON.stringify({ id: data.userId, email: data.email, username: data.username }));
        // One-time flag for index.html's boot sequence — sessionStorage
        // (not localStorage) so it only ever fires for this fresh login,
        // never on a later page refresh/revisit within the same session.
        sessionStorage.setItem('pp_show_welcome', data.username);
        showMessage('login-message', 'Logged in! Redirecting...', false);

        setTimeout(() => {
          window.location.href = '/index.html';
        }, 1000);
      } catch (err) {
        showMessage('login-message', 'Connection failed: ' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    async function handleVerify(e) {
      e.preventDefault();
      const token = document.getElementById('verify-token').value;
      const btn = e.target.querySelector('button');
      const originalText = btn.textContent;

      try {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Verifying...';

        const res = await fetch(`${window.API_BASE}/api/auth/verify-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });

        const data = await res.json();

        if (!res.ok) {
          showMessage('verify-message', data.error, true);
          return;
        }

        showMessage('verify-message', 'Email verified! Redirecting to login...', false);
        setTimeout(() => {
          document.getElementById('verify-form').classList.add('hidden');
          document.getElementById('login-form').classList.remove('hidden');
        }, 2000);
      } catch (err) {
        showMessage('verify-message', 'Connection failed: ' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    // Check if we're verifying email from URL param
    window.addEventListener('load', async () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (token) {
        // Auto-verify silently
        try {
          const res = await fetch(`${window.API_BASE}/api/auth/verify-email`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token }),
          });

          if (res.ok) {
            showMessage('verify-message', 'Email verified! Redirecting to login...', false);
            setTimeout(() => {
              document.getElementById('verify-form').classList.add('hidden');
              document.getElementById('login-form').classList.remove('hidden');
              // Clear the token from URL
              window.history.replaceState({}, document.title, '/login.html');
            }, 2000);
          } else {
            const data = await res.json();
            showMessage('verify-message', data.error, true);
            document.getElementById('verify-form').classList.remove('hidden');
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('verify-token').value = token;
          }
        } catch (err) {
          showMessage('verify-message', 'Verification failed: ' + err.message, true);
          document.getElementById('verify-form').classList.remove('hidden');
          document.getElementById('login-form').classList.add('hidden');
        }
      }

      // Check if already logged in
      const storedToken = localStorage.getItem(AUTH_TOKEN_KEY);
      if (storedToken && !token) {
        window.location.href = '/index.html';
      }
    });

    // Add logout handler (called from app.js)
    window.logout = function() {
      if (confirm('Are you sure you want to sign out?')) {
        localStorage.removeItem(window.AUTH_TOKEN_KEY);
        localStorage.removeItem(window.AUTH_USER_KEY);
        window.location.href = 'https://perpetualpicks.com/login.html';
      }
    };
  </script>
</body>
</html>
