<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Pick</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="One button. Sharp picks.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Pick">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <h1 class="wordmark">PIXEL<span>PICK</span></h1>
  <button id="historyToggle" class="icon-btn" aria-expanded="false" aria-controls="historyPanel">
    History<span id="historyCount" class="badge" hidden>0</span>
  </button>
</header>

<main id="main">
  <div id="status" class="status" role="status" aria-live="polite">Loading the board…</div>

  <button id="generate" class="generate" disabled>
    <span class="generate-label">Generate Picks</span>
    <span id="poolLine" class="generate-sub">—</span>
  </button>

  <section id="picks" class="picks" aria-live="polite"></section>

  <p class="disclaimer">
    Odds move. Always confirm the number at the book before you bet.
    21+. For entertainment only — nothing here is financial advice.
    <a href="https://www.1800gambler.net/" target="_blank" rel="noopener">1-800-GAMBLER</a>
  </p>
</main>

<div id="scrim" class="scrim" hidden></div>

<aside id="historyPanel" class="history" aria-label="Pick history" hidden>
  <div class="history-head">
    <h2>History</h2>
    <button id="historyClose" class="icon-btn" aria-label="Close history">✕</button>
  </div>
  <div id="historyList" class="history-list"></div>
  <button id="historyClear" class="clear-btn">Clear history</button>
</aside>

<script type="module" src="app.js"></script>
</body>
</html>
