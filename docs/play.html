<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<!-- Content-Security-Policy, as on every page: no inline script. This page frames one thing, the play's own page
     from the worker, so that address is the only frame allowed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://pixel-pick-odds.mgbouldering.workers.dev; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="frame-guard.js?v=1.398"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05050A">
  <title>Perpetual Picks - Live play</title>
  <link rel="icon" href="assets/logo-icon-64.png" type="image/png">
  <style>
    html, body { margin: 0; height: 100%; background: #05050A; color: #F3F1FA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #playFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #05050A; }
    #playNote { max-width: 420px; margin: 0 auto; padding: 80px 20px; text-align: center; line-height: 1.6; }
    #playNote a { color: #A78BFA; font-weight: 700; }
  </style>
</head>
<body>
  <iframe id="playFrame" title="Live play" hidden></iframe>
  <div id="playNote" hidden>
    <p>That play is not on file.</p>
    <p><a href="app.html">Open Perpetual Picks</a></p>
  </div>
  <script type="module" src="play.js?v=1.398"></script>
</body>
</html>
